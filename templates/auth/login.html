<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Student Attendance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f9fafb;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .login-wrapper {
            max-width: 400px;
            width: 100%;
        }
        .login-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
        }
        .brand-mark {
            width: 40px; height: 40px;
            background: #4f46e5;
            color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            margin-bottom: 24px;
        }
        h1 { font-size: 1.25rem; font-weight: 700; color: #111827; margin: 0 0 4px; }
        .subtitle { font-size: 0.82rem; color: #6b7280; margin-bottom: 24px; }
        label { font-size: 0.78rem; font-weight: 600; color: #374151; margin-bottom: 5px; display: block; }
        .form-control, .form-select {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.85rem;
            padding: 9px 12px;
            color: #111827;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79,70,229,0.1);
        }
        .login-btn {
            background: #4f46e5;
            border: none;
            color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .login-btn:hover { background: #4338ca; }
        .quick-logins { margin-top: 24px; padding-top: 20px; border-top: 1px solid #f3f4f6; }
        .quick-label { font-size: 0.65rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
        .quick-btn {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            transition: all 0.12s ease;
        }
        .quick-btn:hover { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-mark">
                <i class="bi bi-calendar2-check"></i>
            </div>

            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to the Student Attendance Management System</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 px-3 small mb-3" role="alert">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="role">Portal</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
                        <option value="faculty" {% if role == 'faculty' %}selected{% endif %}>Faculty</option>
                        <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrator</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="identifier">Username or Registration Number</label>
                    <input type="text" class="form-control" id="identifier" name="identifier"
                           placeholder="e.g. 24BAI0250, FAC001, admin"
                           value="{{ identifier or '' }}" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Sign in</button>
            </form>

            <div class="quick-logins">
                <div class="quick-label">Quick test login</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="quick-btn" onclick="fillLogin('admin','admin123','admin')">Admin</button>
                    <button type="button" class="quick-btn" onclick="fillLogin('FAC001','faculty123','faculty')">Faculty (FAC001)</button>
                    <button type="button" class="quick-btn" onclick="fillLogin('24BAI0250','student123','student')">Saketh</button>
                    <button type="button" class="quick-btn" onclick="fillLogin('24BCE0662','student123','student')">Marthav</button>
                    <button type="button" class="quick-btn" onclick="fillLogin('24BCT0308','student123','student')">Reeyan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    function fillLogin(id, pw, role) {
        document.getElementById('identifier').value = id;
        document.getElementById('password').value = pw;
        document.getElementById('role').value = role;
    }
    </script>
</body>
</html>
